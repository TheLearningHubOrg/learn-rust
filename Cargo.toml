[package]
name = "learn-rust"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Manthan Ankolekar"]
description = "Starter service for the Learn Rust guide: ownership, enums, error handling and a small axum API."
license = "MIT"
repository = "https://github.com/TheLearningHubOrg/learn-rust"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
