[package]
name = "learn-rust"
version = "0.1.0"
edition = "2021"
authors = ["Manthan Ank"]
description = "An exhaustive, production-grade masterclass on Rust systems programming, memory safety, and concurrency."

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-test = "0.4"
